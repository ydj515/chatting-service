name: Kotlin Quality

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Kotlin quality
        run: ./gradlew verifyKotlinQuality --no-daemon --console=plain
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-quality-reports
          path: |
            build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHAT_TEST_REDIS_PORT: 6379
      CHAT_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/chat_test
      CHAT_TEST_POSTGRES_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test architecture and coverage gates
        run: ./gradlew check --no-daemon --console=plain
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          path: |
            **/build/reports/tests/
            build/reports/kover/
          if-no-files-found: ignore
