name: Kotlin Quality

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Kotlin quality
        run: ./gradlew verifyKotlinQuality --no-daemon --console=plain
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-quality-reports
          path: |
            build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test architecture and coverage gates
        run: ./gradlew check --no-daemon --console=plain
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          path: |
            **/build/reports/tests/
            build/reports/kover/
          if-no-files-found: ignore
