config:
  validation: true
  warningsAsErrors: true

complexity:
  ComplexCondition:
    threshold: 6
  LargeClass:
    threshold: 1000
  LongMethod:
    threshold: 150
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    thresholdInEnums: 20

style:
  VarCouldBeVal:
    ignoreLateinitVar: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 7
  ThrowsCount:
    max: 5

# Mockito matchers/captors register arguments as a side effect and may return null.
potential-bugs:
  IgnoredReturnValue:
    ignoreFunctionCall:
      - 'org.mockito.ArgumentMatchers.any'
      - 'org.mockito.ArgumentMatchers.anyString'
      - 'org.mockito.ArgumentMatchers.anyList'
      - 'org.mockito.ArgumentMatchers.anyMap'
      - 'org.mockito.ArgumentMatchers.eq'
      - 'org.mockito.ArgumentMatchers.contains'
      - 'org.mockito.ArgumentCaptor.capture'
