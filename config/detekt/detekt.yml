config:
  validation: true
  warningsAsErrors: true

complexity:
  ComplexCondition:
    threshold: 6
  LargeClass:
    threshold: 1000
  LongMethod:
    threshold: 150
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    thresholdInEnums: 20

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 7
  ThrowsCount:
    max: 5
